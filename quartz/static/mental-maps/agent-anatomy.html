<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent anatomy — six layers</title>
<style>
  :root{
    --bg:#000; --panel:#131310; --line:#3a3a30; --gold:#c4ab00; --gold-t:#f0c040;
    --txt:#e8e8dd; --sub:#8f8f80; --dim:#6f6f62;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font-family:"MADE Tommy",system-ui,-apple-system,"Segoe UI",sans-serif}
  .wrap{padding:6px 10px 0;overflow-x:auto}
  svg{display:block;width:100%;height:auto;min-width:900px}
  .foot{display:flex;gap:18px;align-items:center;flex-wrap:wrap;
    padding:6px 6px 10px;font-size:11px;color:var(--sub)}
  .foot i{display:inline-block;width:22px;height:0;border-top:2px solid var(--gold);
    margin-right:7px;vertical-align:middle}
  .foot i.dash{border-top:2px dashed var(--gold-t);opacity:.75}
  @media (max-width:640px){ .foot{font-size:10px;gap:12px} }
</style>
</head>
<body>
<div class="wrap">
<svg id="d" viewBox="0 0 1560 660" role="img" aria-label="Six-layer agent anatomy: trigger, skill, context, run, output, operations">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1b1b15" stroke-width="1"/>
    </pattern>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c4ab00"/>
    </marker>
    <marker id="arwd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f0c040"/>
    </marker>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1a10"/>
      <stop offset="1" stop-color="#0b0b09"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1560" height="660" fill="url(#grid)"/>

  <!-- spine -->
  <path d="M 155 74 H 1405" stroke="#2b2b22" stroke-width="2"/>
  <g stroke="#c4ab00" stroke-width="2" marker-end="url(#arw)">
    <path d="M 275 74 H 300"/>
    <path d="M 535 74 H 560"/>
    <path d="M 795 74 H 820"/>
    <path d="M 1055 74 H 1080"/>
    <path d="M 1315 74 H 1340"/>
  </g>

  <!-- column headers -->
  <g font-size="11" font-weight="700" letter-spacing="2.2" fill="#d9c24a" text-anchor="middle">
    <g><rect x="45" y="46" width="220" height="56" rx="10" fill="url(#fade)" stroke="#332f12"/>
       <text x="155" y="72">01 · TRIGGER</text>
       <text x="155" y="89" fill="#7f7a55" font-size="9" letter-spacing="1.4">what wakes it up</text></g>
    <g><rect x="305" y="46" width="220" height="56" rx="10" fill="url(#fade)" stroke="#332f12"/>
       <text x="415" y="72">02 · SKILL</text>
       <text x="415" y="89" fill="#7f7a55" font-size="9" letter-spacing="1.4">what it must do</text></g>
    <g><rect x="565" y="46" width="220" height="56" rx="10" fill="url(#fade)" stroke="#332f12"/>
       <text x="675" y="72">03 · CONTEXT</text>
       <text x="675" y="89" fill="#7f7a55" font-size="9" letter-spacing="1.4">what it may know</text></g>
    <g><rect x="825" y="46" width="220" height="56" rx="10" fill="url(#fade)" stroke="#332f12"/>
       <text x="935" y="72">04 · RUN</text>
       <text x="935" y="89" fill="#7f7a55" font-size="9" letter-spacing="1.4">what it may touch</text></g>
    <g><rect x="1085" y="46" width="220" height="56" rx="10" fill="url(#fade)" stroke="#332f12"/>
       <text x="1195" y="72">05 · OUTPUT</text>
       <text x="1195" y="89" fill="#7f7a55" font-size="9" letter-spacing="1.4">where it lands</text></g>
    <g><rect x="1345" y="46" width="220" height="56" rx="10" fill="url(#fade)" stroke="#332f12"/>
       <text x="1455" y="72">06 · OPS</text>
       <text x="1455" y="89" fill="#7f7a55" font-size="9" letter-spacing="1.4">who watches it</text></g>
  </g>

  <g stroke="#33332b" stroke-width="1.5">
    <path d="M 155 102 V 138"/><path d="M 415 102 V 138"/><path d="M 675 102 V 138"/>
    <path d="M 935 102 V 138"/><path d="M 1195 102 V 138"/><path d="M 1455 102 V 138"/>
  </g>

  <g font-size="12.5" fill="#ecece4">
    <!-- 01 -->
    <g><rect x="45" y="138" width="220" height="62" rx="8" fill="#131310" stroke="#3a3a30"/>
       <text x="63" y="164">💬 Chat</text><text x="63" y="184" font-size="10" fill="#8f8f80">CLI · Telegram topic</text></g>
    <g><rect x="45" y="214" width="220" height="62" rx="8" fill="#131310" stroke="#3a3a30"/>
       <text x="63" y="240">⏱ Scheduler</text><text x="63" y="260" font-size="10" fill="#8f8f80">144 enabled jobs</text></g>
    <g><rect x="45" y="290" width="220" height="62" rx="8" fill="#131310" stroke="#3a3a30"/>
       <text x="63" y="316">📥 File hook</text><text x="63" y="336" font-size="10" fill="#8f8f80">run_prompt · watcher</text></g>

    <!-- 02 -->
    <g><rect x="305" y="138" width="220" height="86" rx="8" fill="#1b1a10" stroke="#c4ab00" stroke-width="1.8"/>
       <text x="323" y="164" font-weight="700">SKILL.md</text>
       <text x="323" y="184" font-size="10" fill="#a9a58a">role · workflow</text>
       <text x="323" y="200" font-size="10" fill="#a9a58a">guardrails · output contract</text>
       <text x="323" y="216" font-size="10" fill="#a9a58a">memory</text></g>
    <g><rect x="305" y="240" width="220" height="62" rx="8" fill="#131310" stroke="#3a3a30"/>
       <text x="323" y="266">Model routing</text><text x="323" y="286" font-size="10" fill="#8f8f80">local ↔ cloud</text></g>

    <!-- 03 -->
    <g><rect x="565" y="138" width="220" height="62" rx="8" fill="#141412" stroke="#8a7420" stroke-width="1.5"/>
       <text x="583" y="164" fill="#f0c040">Vault</text><text x="583" y="184" font-size="10" fill="#a9a58a">4.063 notes · wikilinks</text></g>
    <g><rect x="565" y="214" width="220" height="62" rx="8" fill="#141412" stroke="#8a7420" stroke-width="1.5"/>
       <text x="583" y="240" fill="#f0c040">Graph</text><text x="583" y="260" font-size="10" fill="#a9a58a">51.811 triples · SPARQL</text></g>
    <g><rect x="565" y="290" width="220" height="62" rx="8" fill="#141412" stroke="#8a7420" stroke-width="1.5"/>
       <text x="583" y="316" fill="#f0c040">RAG</text><text x="583" y="336" font-size="10" fill="#a9a58a">14.180 chunks · fused</text></g>
    <g><rect x="565" y="366" width="220" height="62" rx="8" fill="#131310" stroke="#3a3a30"/>
       <text x="583" y="392">Memory</text><text x="583" y="412" font-size="10" fill="#8f8f80">profile · project · history</text></g>

    <!-- 04 -->
    <g><rect x="825" y="138" width="220" height="62" rx="8" fill="#131310" stroke="#3a3a30"/>
       <text x="843" y="164">Tools</text><text x="843" y="184" font-size="10" fill="#8f8f80">files · shell · APIs</text></g>
    <g><rect x="825" y="214" width="220" height="86" rx="8" fill="#1b1a10" stroke="#c4ab00" stroke-width="1.8"/>
       <text x="843" y="240" font-weight="700">Gate</text>
       <text x="843" y="260" font-size="10" fill="#a9a58a">privacy firewall</text>
       <text x="843" y="276" font-size="10" fill="#a9a58a">GO before send</text>
       <text x="843" y="292" font-size="10" fill="#a9a58a">write-scope</text></g>
    <g><rect x="825" y="314" width="220" height="62" rx="8" fill="#131310" stroke="#3a3a30"/>
       <text x="843" y="340">Logs</text><text x="843" y="360" font-size="10" fill="#8f8f80">every run, every stop</text></g>

    <!-- 05 -->
    <g><rect x="1085" y="138" width="220" height="86" rx="8" fill="#1b1a10" stroke="#c4ab00" stroke-width="1.8"/>
       <text x="1103" y="164" font-weight="700">Vault note</text>
       <text x="1103" y="184" font-size="10" fill="#a9a58a">frontmatter · wikilinks</text>
       <text x="1103" y="200" font-size="10" fill="#a9a58a">right folder, ready for</text>
       <text x="1103" y="216" font-size="10" fill="#a9a58a">the graph</text></g>
    <g><rect x="1085" y="240" width="220" height="86" rx="8" fill="#131310" stroke="#3a3a30"/>
       <text x="1103" y="266">Channels</text>
       <text x="1103" y="286" font-size="10" fill="#8f8f80">Telegram · Blog</text>
       <text x="1103" y="302" font-size="10" fill="#8f8f80">WhatsApp · Anki</text>
       <text x="1103" y="318" font-size="10" fill="#8f8f80">calendar</text></g>

    <!-- 06 -->
    <g><rect x="1345" y="138" width="220" height="62" rx="8" fill="#131310" stroke="#3a3a30"/>
       <text x="1363" y="164">Healers</text><text x="1363" y="184" font-size="10" fill="#8f8f80">dead daemon · stale index</text></g>
    <g><rect x="1345" y="214" width="220" height="62" rx="8" fill="#131310" stroke="#3a3a30"/>
       <text x="1363" y="240">Watchdogs</text><text x="1363" y="260" font-size="10" fill="#8f8f80">red alerts only</text></g>
    <g><rect x="1345" y="290" width="220" height="62" rx="8" fill="#131310" stroke="#3a3a30"/>
       <text x="1363" y="316">Backup</text><text x="1363" y="336" font-size="10" fill="#8f8f80">weekly · floor 35K triples</text></g>
  </g>

  <!-- feedback rail -->
  <path d="M 1195 326 V 500 H 155 V 356" fill="none" stroke="#f0c040" stroke-width="1.6"
        stroke-dasharray="6 6" opacity=".6" marker-end="url(#arwd)"/>
  <text x="675" y="492" font-size="10" fill="#b6a457" text-anchor="middle">
    re-index after every write · healers wake the scheduler · logs escalate to red alerts
  </text>

  <g font-size="9.5" fill="#6f6f62" letter-spacing="1.2">
    <text x="45" y="392">NO AGENT WITHOUT A TIME</text>
    <text x="45" y="408">NO WRITE WITHOUT A GATE</text>
    <text x="1345" y="392">SILENT UNTIL BROKEN</text>
  </g>
</svg>
</div>
<div class="foot">
  <span><i></i>data flow</span>
  <span><i class="dash"></i>feedback / operations</span>
  <span style="color:#5f5f55">six layers · one loop · no agent names</span>
</div>
<script>
/* keep the hosting iframe exactly as tall as the diagram (same-origin) */
(function () {
  function sync() {
    var fe = window.frameElement;
    if (!fe) return;
    var h = Math.ceil(document.body.getBoundingClientRect().height);
    if (h && Math.abs(parseInt(fe.style.height || 0, 10) - h) > 2) fe.style.height = h + 'px';
  }
  window.addEventListener('load', sync);
  window.addEventListener('resize', sync);
  if (window.ResizeObserver) new ResizeObserver(sync).observe(document.body);
  setTimeout(sync, 200);
  setTimeout(sync, 800);
})();
</script>
</body>
</html>
